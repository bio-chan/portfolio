<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="utf-8">
   <title>Ad Blocker Pro</title>
   <link rel="stylesheet" href="shared.css">
   <link rel="stylesheet" href="popup.css">
</head>
<body class="state-active">
   <div class="ambient"></div>
   <main class="popup">
      <header class="top">
         <img class="brand-icon" src="../icons/48.png" alt="" width="22" height="22">
         <span class="brand-name">Ad Blocker Pro</span>
         <button id="gearBtn" class="icon-btn" title="Settings" aria-label="Settings"
            data-i18n-title="uiOpenSettings" data-i18n-aria="uiOpenSettings">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
               <circle cx="12" cy="12" r="3"></circle>
               <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
         </button>
      </header>

      <section class="card hero">
         <div class="site-chip">
            <span class="dot" aria-hidden="true"></span>
            <span id="siteName" class="mono">&hellip;</span>
         </div>
         <h1 id="statusTitle" class="status" aria-live="polite">Protection active</h1>
         <p id="statusHint" class="hint">Ads and trackers are being blocked on this site.</p>

         <div class="toggle-row" id="toggleRow">
            <label class="switch switch-lg">
               <input type="checkbox" id="pauseToggle" checked role="switch" aria-checked="true"
                  data-i18n-aria="uiPopupToggleAria" aria-label="Pause or resume blocking on this site">
               <span class="track"></span>
            </label>
            <span id="toggleLabel" class="toggle-label">Blocking on</span>
         </div>

         <button id="manageAllowedBtn" class="btn manage-allowed hidden"
            data-i18n="uiPopupManageAllowed">Manage allowed sites</button>
      </section>

      <section class="card yt-card" id="ytCard">
         <div class="yt-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
               <polygon points="13 19 22 12 13 5 13 19"></polygon>
               <polygon points="2 19 11 12 2 5 2 19"></polygon>
            </svg>
         </div>
         <div class="yt-copy">
            <span class="yt-title" data-i18n="uiYtTitle">YouTube ads</span>
            <span class="yt-desc" data-i18n="uiYtPopupDesc">Fast-forward video ads that slip through</span>
         </div>
         <label class="switch">
            <input type="checkbox" id="ytToggle" role="switch" aria-checked="false"
               data-i18n-aria="uiYtToggleAria" aria-label="Fast-forward YouTube video ads on or off">
            <span class="track"></span>
         </label>
      </section>

      <section class="card stat" data-i18n-title="uiStatExplainer"
         title="Counts every page visit where blocking was active — pages protected, not individual ads.">
         <div class="stat-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
               <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
         </div>
         <span class="stat-label" data-i18n="uiPopupStatLabel">Pages protected</span>
         <span id="statValue" class="stat-value mono">0</span>
      </section>

      <button id="settingsBtn" class="btn footer-btn" data-i18n="uiPopupSettings">Manage sites &amp; settings</button>
   </main>

   <script src="../engine/log.js"></script>
   <script src="../engine/domains.js"></script>
   <script src="../engine/bypass.js"></script>
   <script src="../engine/storage.js"></script>
   <script src="shared.js"></script>
   <script src="popup.js"></script>
</body>
</html>
